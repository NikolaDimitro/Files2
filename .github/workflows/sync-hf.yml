name: Sync to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Configure Git
        run: |
          git config --global user.email "your-email@example.com"
          git config --global user.name "NikolaDimitro"

      - name: Push to Hugging Face
        run: |
          git remote add hf https://oauth2:${{ secrets.HF_TOKEN }}@huggingface.co/datasets/Moon8090/Files
          git push hf HEAD:main --force
